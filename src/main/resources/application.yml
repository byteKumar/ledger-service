spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:${USER}}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for all in-sync replicas; idempotent producer = no duplicates from producer retries.
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ledger:
  transfer:
    # optimistic | pessimistic   (env: LEDGER_TRANSFER_LOCKING)
    locking: optimistic
    # Attempts per transfer before giving up with 503 (optimistic mode retries on version conflicts).
    max-attempts: 10

  outbox:
    relay:
      # Turn off in the API process to run the relay as its own process.
      enabled: true
      poll-interval-ms: 100
      batch-size: 500

  consumer:
    # The example downstream consumer (dedupes by event id).
    enabled: true
