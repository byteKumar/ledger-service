spring:
  application:
    name: ledger-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:${USER}}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

ledger:
  transfer:
    # optimistic | pessimistic   (env: LEDGER_TRANSFER_LOCKING)
    locking: optimistic
    # Attempts per transfer before giving up with 503 (optimistic mode retries on version conflicts).
    max-attempts: 10
