name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # GitHub's Ubuntu runners have Docker, so Testcontainers starts real
    # Postgres 14 and Kafka 4.4 containers, the same as on a laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit + integration tests. Benchmarks are tagged "bench" and excluded by the pom.
      - name: mvn verify
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 14
